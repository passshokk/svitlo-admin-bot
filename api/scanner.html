<!-- scanner.html -->
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Svitlo Document Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Брендбук Svitlo School */
            --brand-dark:   #1A393F;
            --brand-gold:   #DCAF42;
            --brand-sage:   #97BBA7;
            --brand-red:    #912627;

            --accent-color: #2481cc;
            --success-color: var(--brand-sage);
            --warning-color: var(--brand-gold);
            --bg-color: #000000;

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #scanner-container {
            position: fixed;
            inset: 0;
            background: #000;
            overflow: hidden;
        }

        video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter .25s ease;
        }

        /* ---------- Верхня панель ---------- */
        .top-bar {
            position: absolute;
            top: calc(var(--safe-top) + 12px);
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            z-index: 60;
        }

        .segment-control {
            flex: 1;
            display: flex;
            background: rgba(28, 28, 30, 0.55);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 13px;
            padding: 3px;
        }

        .segment-btn {
            flex: 1;
            background: transparent;
            color: rgba(255, 255, 255, 0.65);
            border: none;
            padding: 9px 2px;
            font-size: 12.5px;
            font-weight: 600;
            font-family: inherit;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .25s ease, color .25s ease;
        }

        .segment-btn.active {
            background: rgba(220, 175, 66, 0.28);
            color: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(28, 28, 30, 0.55);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 13px;
            font-size: 18px;
            color: #fff;
            cursor: pointer;
            transition: background .2s ease;
        }

        .icon-btn.available { display: flex; }
        .icon-btn.on { background: rgba(255, 255, 255, 0.85); color: #000; }

        /* Короткий помітний підказник на перші кілька секунд — щоб не
           губилась опція вибору типу документа над рамкою. */
        .type-hint {
            position: absolute;
            top: calc(var(--safe-top) + 66px);
            left: 50%;
            transform: translateX(-50%) translateY(-6px);
            background: var(--brand-gold);
            color: var(--brand-dark);
            font-size: 12.5px;
            font-weight: 700;
            padding: 7px 14px;
            border-radius: 14px;
            white-space: nowrap;
            z-index: 61;
            opacity: 0;
            pointer-events: none;
            animation: typeHintPulse 4s ease forwards;
        }

        @keyframes typeHintPulse {
            0%   { opacity: 0; transform: translateX(-50%) translateY(-6px); }
            10%  { opacity: 1; transform: translateX(-50%) translateY(0); }
            82%  { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-6px); }
        }

        /* ---------- Видошукач ---------- */
        .overlay-mask {
            position: absolute;
            inset: 0;
            z-index: 10;
            pointer-events: none;
        }

        .viewfinder {
            /* top:40%, а не рівний центр (50%) — трохи вище лишає більше
               місця знизу під підказку та кнопки. */
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 18px;
            /* Затемнення всього, що поза рамкою.
               9999px спред ламає заокруглення кута в WKWebView (Telegram iOS) —
               рамка виходила гострокутною попри border-radius. 100vmax з запасом
               покриває будь-який екран і залишається в межах, які Safari рендерить коректно. */
            box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.62);
            transition: width .35s cubic-bezier(.25,.8,.25,1),
                        aspect-ratio .35s cubic-bezier(.25,.8,.25,1);
        }

        .viewfinder.type-id       { width: 88vw; max-width: 440px; aspect-ratio: 1.58 / 1; }
        .viewfinder.type-passport { width: 88vw; max-width: 440px; aspect-ratio: 1.42 / 1; }
        .viewfinder.type-cert     { width: 74vw; max-width: 380px; aspect-ratio: 1 / 1.41; }

        .corner {
            position: absolute;
            width: 26px;
            height: 26px;
            border: 3px solid rgba(255, 255, 255, 0.9);
            transition: border-color .25s ease, filter .25s ease;
        }

        .top-left     { top: -1px; left: -1px;  border-right: none; border-bottom: none; border-radius: 18px 0 0 0; }
        .top-right    { top: -1px; right: -1px; border-left: none;  border-bottom: none; border-radius: 0 18px 0 0; }
        .bottom-left  { bottom: -1px; left: -1px;  border-right: none; border-top: none; border-radius: 0 0 0 18px; }
        .bottom-right { bottom: -1px; right: -1px; border-left: none;  border-top: none; border-radius: 0 0 18px 0; }

        /* Стани аналізатора — колір лише на кутиках, без суцільних рамок */
        .viewfinder.status-moving .corner {
            border-color: var(--warning-color);
            filter: drop-shadow(0 0 5px rgba(220, 175, 66, 0.6));
        }

        .viewfinder.status-focusing .corner {
            border-color: var(--accent-color);
            filter: drop-shadow(0 0 5px rgba(36, 129, 204, 0.55));
        }

        /* Прогрес автозахоплення — тонка дуга під рамкою */
        .focus-bar {
            position: absolute;
            left: 50%;
            bottom: -14px;
            transform: translateX(-50%);
            width: 64px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.18);
            overflow: hidden;
            opacity: 0;
            transition: opacity .2s ease;
        }

        .viewfinder.status-focusing .focus-bar { opacity: 1; }

        .focus-bar > i {
            display: block;
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            transition: width .1s linear;
        }

        /* ---------- Прев'ю знімка ---------- */
        #snapshot-canvas {
            display: none;
            position: absolute;
            top: 46%;
            left: 50%;
            transform: translate(-50%, -50%) scale(.96);
            opacity: 0;
            max-width: 88vw;
            max-height: 58vh;
            border: none;                       /* без кислотної обводки */
            border-radius: 14px;
            box-shadow: 0 14px 44px rgba(0, 0, 0, 0.7),
                        0 0 0 1px rgba(255, 255, 255, 0.14);
            z-index: 15;                        /* НИЖЧЕ за підказку та кнопки */
            transition: opacity .25s ease, transform .25s cubic-bezier(.2,.8,.2,1);
        }

        /* ---------- Підказка та кнопки ---------- */
        .hint-text {
            position: absolute;
            left: 50%;
            bottom: calc(var(--safe-bottom) + 104px);
            transform: translateX(-50%);
            max-width: 88vw;
            text-align: center;
            font-size: 14.5px;
            font-weight: 500;
            line-height: 1.3;
            color: #fff;
            background: rgba(0, 0, 0, 0.55);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 18px;
            z-index: 50;
            transition: opacity .2s ease;
        }

        .action-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(var(--safe-bottom) + 26px);
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 50;
            pointer-events: none;
        }

        .action-bar > button {
            display: none;
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.14);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.22);
            padding: 13px 26px;
            border-radius: 22px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background .18s ease, transform .18s ease;
        }

        .action-bar > button:active { background: rgba(255, 255, 255, 0.26); transform: scale(.97); }

        /* Ручний спуск — класичне кільце затвора замість текстової кнопки */
        #manual-snap-btn {
            width: 68px;
            height: 68px;
            padding: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            border: 4px solid rgba(255, 255, 255, 0.35);
            background-clip: padding-box;
        }

        #manual-snap-btn:active { background: rgba(255, 255, 255, 0.7); }

        /* ---------- Керування станами ---------- */
        body.state-manual #manual-snap-btn { display: block; }

        body.state-preview video,
        body.state-preview .overlay-mask,
        body.state-preview .top-bar,
        body.state-preview #manual-snap-btn { display: none !important; }

        body.state-preview #snapshot-canvas {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        body.state-preview #retake-btn { display: block; }

        /* У прев'ю фото над кнопками лишалось багато порожнього простору —
           підказку тримаємо ближче до дій, а не посередині екрана. */
        body.state-preview .hint-text {
            bottom: calc(var(--safe-bottom) + 96px);
        }

        body.state-preview .hint-text::before {
            content: "";
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 8px;
            border-radius: 50%;
            background: var(--success-color);
            vertical-align: middle;
        }

        /* Спалах затвора */
        #flash {
            position: absolute;
            inset: 0;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 90;
        }

        #flash.fire { animation: shutter .28s ease-out; }

        @keyframes shutter {
            0%   { opacity: .85; }
            100% { opacity: 0; }
        }

        #processing-canvas { display: none; }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>

    <div id="scanner-container">
        <video id="camera" autoplay playsinline muted></video>

        <div class="top-bar">
            <div class="segment-control">
                <button class="segment-btn active" data-type="type-id">ID-картка</button>
                <button class="segment-btn" data-type="type-passport">Закордонний</button>
                <button class="segment-btn" data-type="type-cert">Свідоцтво</button>
            </div>
            <button class="icon-btn" id="torch-btn" aria-label="Ліхтарик">🔦</button>
        </div>

        <div class="type-hint" id="type-hint">👆 Обери тип документа</div>

        <div class="overlay-mask">
            <div class="viewfinder type-id" id="viewfinder">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
                <div class="focus-bar"><i id="focus-progress"></i></div>
            </div>
        </div>

        <canvas id="snapshot-canvas"></canvas>

        <div class="hint-text" id="hint-text">Наведи на документ</div>

        <div class="action-bar">
            <button id="manual-snap-btn" aria-label="Зробити фото"></button>
            <button id="retake-btn">🔄 Перезняти</button>
        </div>

        <div id="flash"></div>
    </div>

    <canvas id="processing-canvas" width="100" height="100"></canvas>

    <script>
    (function () {
        "use strict";

        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        try {
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        } catch (e) { /* старі клієнти Telegram */ }

        // --- DOM ---
        const video        = document.getElementById('camera');
        const viewfinder   = document.getElementById('viewfinder');
        const hintText     = document.getElementById('hint-text');
        const manualBtn    = document.getElementById('manual-snap-btn');
        const retakeBtn    = document.getElementById('retake-btn');
        const torchBtn     = document.getElementById('torch-btn');
        const focusProgress= document.getElementById('focus-progress');
        const flashEl      = document.getElementById('flash');
        const typeHint     = document.getElementById('type-hint');
        const segmentBtns  = document.querySelectorAll('.segment-btn');

        const procCanvas = document.getElementById('processing-canvas');
        const procCtx    = procCanvas.getContext('2d', { willReadFrequently: true });
        const snapCanvas = document.getElementById('snapshot-canvas');

        // --- Стейт ---
        let isCaptured        = false;
        let binaryBlob        = null;
        let isEncoding        = false;   // toBlob ще не завершився
        let processInterval   = null;
        let manualFallbackTimer = null;
        let analyzerWorker    = null;
        let isProcessingFrame = false;
        let focusFrames       = 0;
        let badStreak         = 0;
        let mediaStream       = null;
        let torchOn           = false;

        // --- Пороги автозахоплення ---
        // Заміряно на синтетичних кадрах 100x100:
        //   документ  -> edges 6..19,  contrast 53..81
        //   долоня    -> edges 0.16,   contrast 4.3
        //   стіл/стіна-> edges 0.13,   contrast 0..13
        const MOTION_THRESH    = 12;  // середня різниця пікселів між кадрами
        const SHARPNESS_THRESH = 4;   // середній горизонтальний градієнт (деталізація/різкість)
        const CONTRAST_THRESH  = 20;  // стандартне відхилення яскравості (у кадрі документ, а не рука/стіна)
        const FRAMES_TO_FREEZE = 10;  // 10 кадрів * 100мс = 1с стабільності
        const FALLBACK_MS      = 10000;
        const BAD_FRAME_TOLERANCE = 3; // терпимість до одиничного шуму (дрож, блік), щоб рамка/текст не мигали

        const HINTS = {
            'type-id':       "Наведи на ID-картку — має бути видно все поле рамки",
            'type-passport': "Наведи на головну сторінку паспорта",
            'type-cert':     "Свідоцтво про народження має вміститись цілком"
        };

        function setHint(text) {
            if (hintText.innerText !== text) hintText.innerText = text;
        }

        function activeType() {
            const btn = document.querySelector('.segment-btn.active');
            return btn ? btn.getAttribute('data-type') : 'type-id';
        }

        // ============ Вибір фізичної камери (без "віртуальних" мультилінзових) ============
        // На iPhone з кількома задніми об'єктивами facingMode:"environment" часто
        // резолвиться в "віртуальний" Dual/Triple Camera пристрій, чий дефолтний
        // zoom НЕ відповідає тому, що нативний Camera-додаток показує як "1x" —
        // тому кадр виглядає сильно наближеним. Керувати зумом через getUserMedia
        // constraints надійного способу немає (підтверджено відкритим тікетом
        // Apple/WebKit — https://developer.apple.com/forums/thread/776460,
        // https://bugs.webkit.org/show_bug.cgi?id=253186). Єдиний робочий обхід —
        // обрати конкретний фізичний об'єктив по deviceId/label напряму.
        async function pickPlainWideBackCameraId() {
            let devices;
            try {
                devices = await navigator.mediaDevices.enumerateDevices();
            } catch (e) {
                return null;
            }

            const backCams = devices.filter(d =>
                d.kind === 'videoinput' && d.label && !/front|user|selfie|face/i.test(d.label)
            );
            if (backCams.length < 2) return null; // лейблів/вибору немає — лишаємось на тому, що вже працює

            const isComposite = (label) => /dual|triple|fusion/i.test(label);
            const isUltraOrTele = (label) => /ultra|tele/i.test(label);

            const preferred =
                backCams.find(d => !isComposite(d.label) && !isUltraOrTele(d.label) && /wide/i.test(d.label)) ||
                backCams.find(d => !isComposite(d.label) && !isUltraOrTele(d.label));

            return preferred ? preferred.deviceId : null;
        }

        // ============ Камера ============
        async function initCamera() {
            // Портретна орієнтація стріму — принципово. 1440x1920 (3:4) ближче
            // до нативного FOV камери, ніж 9:16 — фінальну обрізку під екран
            // все одно робить object-fit:cover.
            const attempts = [
                { video: { facingMode: { ideal: "environment" }, width: { ideal: 1440 }, height: { ideal: 1920 } }, audio: false },
                { video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false },
                { video: { facingMode: "environment" }, audio: false },
                { video: true, audio: false }
            ];

            for (const constraints of attempts) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                    break;
                } catch (err) { /* пробуємо наступний фолбек */ }
            }

            if (!mediaStream) {
                setHint("Немає доступу до камери");
                tg.showAlert("⚠️ Немає доступу до камери. Надай дозвіл у налаштуваннях Telegram");
                return;
            }

            // Тепер, коли дозвіл вже надано, enumerateDevices() повертає лейбли —
            // можна прицільно перепідключитись на звичайний (не віртуальний) Wide-об'єктив.
            const preferredId = await pickPlainWideBackCameraId();
            const activeSettings = mediaStream.getVideoTracks()[0].getSettings();
            if (preferredId && preferredId !== activeSettings.deviceId) {
                try {
                    const refinedStream = await navigator.mediaDevices.getUserMedia({
                        video: { deviceId: { exact: preferredId }, width: { ideal: 1440 }, height: { ideal: 1920 } },
                        audio: false
                    });
                    mediaStream.getTracks().forEach(t => t.stop());
                    mediaStream = refinedStream;
                } catch (e) { /* лишаємось на початковому стрімі */ }
            }

            video.srcObject = mediaStream;
            initTorch();
            initZoom();

            video.onloadedmetadata = () => {
                video.play().catch(() => {});
                setHint(HINTS[activeType()]);
                positionHint();
                startAnalyzer();
                startFallbackTimer();
            };
        }

        function initZoom() {
            // На частині телефонів "environment" камера стартує з дефолтним
            // зумом > 1x (виглядає так, ніби об'єктив "наближає"). Ціль — рівно
            // 1x. Не йдемо нижче: на деяких пристроях діапазон zoom продовжується
            // нижче 1 переключенням на фізичний ультраширокий об'єктив, у якого
            // менший сенсор і помітно більше шуму в темряві.
            const track = mediaStream.getVideoTracks()[0];
            if (!track || typeof track.getCapabilities !== 'function') return;
            const caps = track.getCapabilities();
            if (!caps || !caps.zoom) return;
            const target = Math.min(Math.max(1, caps.zoom.min), caps.zoom.max);
            track.applyConstraints({ advanced: [{ zoom: target }] }).catch(() => {});
        }

        function initTorch() {
            const track = mediaStream.getVideoTracks()[0];
            if (!track || typeof track.getCapabilities !== 'function') return;
            const caps = track.getCapabilities();
            if (!caps || !caps.torch) return;

            torchBtn.classList.add('available');
            torchBtn.addEventListener('click', async () => {
                torchOn = !torchOn;
                try {
                    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
                    torchBtn.classList.toggle('on', torchOn);
                } catch (e) {
                    torchOn = false;
                    torchBtn.classList.remove('available');
                }
            });
        }

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
        }

        // ============ Геометрія: рамка -> координати відеокадру ============
        // Відео рендериться з object-fit: cover, тому потрібен зворотний мапінг.
        function getCropRect() {
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            const vr = video.getBoundingClientRect();
            const fr = viewfinder.getBoundingClientRect();

            if (!vw || !vh || !vr.width) return null;

            const scale = Math.max(vr.width / vw, vr.height / vh);
            const offX  = (vr.width  - vw * scale) / 2;
            const offY  = (vr.height - vh * scale) / 2;

            const PAD = 0.05; // 5% запасу навколо рамки, щоб не зрізати край документа

            let sw = (fr.width  / scale) * (1 + PAD * 2);
            let sh = (fr.height / scale) * (1 + PAD * 2);
            let sx = (fr.left - vr.left - offX) / scale - (fr.width  / scale) * PAD;
            let sy = (fr.top  - vr.top  - offY) / scale - (fr.height / scale) * PAD;

            sx = Math.max(0, Math.min(sx, vw - 1));
            sy = Math.max(0, Math.min(sy, vh - 1));
            sw = Math.min(sw, vw - sx);
            sh = Math.min(sh, vh - sy);

            return { sx, sy, sw, sh };
        }

        // ============ Web Worker аналізу кадру ============
        const WORKER_CODE = `
        let prevGray = null;
        self.onmessage = function (e) {
            if (e.data.command === 'reset') { prevGray = null; return; }

            const d = e.data.imgData;
            const N = 10000;          // 100x100
            const gray = new Uint8Array(N);
            const hadPrev = prevGray !== null;
            let motion = 0, sum = 0, sumSq = 0;

            // Прохід 1: сірий + рух + статистика яскравості
            for (let i = 0; i < N; i++) {
                const o = i * 4;
                const v = (d[o] * 3 + d[o + 1] * 4 + d[o + 2]) >>> 3;
                gray[i] = v;
                sum += v;
                sumSq += v * v;
                if (prevGray) motion += Math.abs(v - prevGray[i]);
            }

            // Прохід 2: горизонтальний градієнт (масив уже повністю заповнений).
            // У попередній версії це рахувалось в одному циклі, тому gray[i+1]
            // завжди дорівнював 0 і "різкість" фактично дорівнювала яскравості кадру.
            let edges = 0;
            for (let i = 0; i < N; i++) {
                if (i % 100 !== 99) edges += Math.abs(gray[i] - gray[i + 1]);
            }

            const mean = sum / N;
            const stddev = Math.sqrt(Math.max(0, sumSq / N - mean * mean));

            prevGray = gray;
            self.postMessage({
                // Перший кадр після старту/ресету не має з чим порівнюватись —
                // повертаємо завідомо великий рух, щоб не спрацював автоспуск
                motion: hadPrev ? motion / N : 999,
                edges: edges / N,
                contrast: stddev
            });
        };
        `;

        function enableManualMode(message) {
            clearInterval(processInterval);
            clearTimeout(manualFallbackTimer);
            viewfinder.classList.remove('status-moving', 'status-focusing');
            document.body.classList.add('state-manual');
            setHint(message);
        }

        try {
            const blob = new Blob([WORKER_CODE], { type: 'application/javascript' });
            analyzerWorker = new Worker(URL.createObjectURL(blob));

            analyzerWorker.onerror = () => {
                analyzerWorker = null;
                enableManualMode("Автофокус недоступний. Зроби фото вручну");
            };

            analyzerWorker.onmessage = (e) => {
                isProcessingFrame = false;
                if (isCaptured) return;

                const { motion, edges, contrast } = e.data;
                const isMoving = motion > MOTION_THRESH;
                // Документ = достатньо деталей І достатній контраст.
                // Долоня, стіл чи стіна дають високу яскравість, але низький контраст.
                const isSharp  = edges > SHARPNESS_THRESH && contrast > CONTRAST_THRESH;

                if (!isMoving && isSharp) {
                    badStreak = 0;
                    viewfinder.classList.remove('status-moving');
                    viewfinder.classList.add('status-focusing');
                    setHint("Тримай так — скануємо");
                    focusFrames++;
                    focusProgress.style.width = Math.min(100, (focusFrames / FRAMES_TO_FREEZE) * 100) + '%';
                    if (focusFrames >= FRAMES_TO_FREEZE) captureFrame();
                    return;
                }

                // Кадр "поганий" (рух/розфокус) — не скидаємо UI одразу.
                // Одиничний шумний кадр не рахуємо: чекаємо серію з BAD_FRAME_TOLERANCE,
                // інакше рамка й текст мигали при щонайменшому дрожі руки.
                badStreak++;
                if (badStreak < BAD_FRAME_TOLERANCE) return;

                focusFrames = 0;
                focusProgress.style.width = '0%';
                viewfinder.classList.remove('status-focusing');

                if (isMoving) {
                    viewfinder.classList.add('status-moving');
                    setHint("Тримай телефон нерухомо");
                } else {
                    viewfinder.classList.remove('status-moving');
                    setHint("Розмісти документ у рамці повністю");
                }
            };
        } catch (err) {
            console.error("Web Worker заблоковано CSP або не підтримується:", err);
            analyzerWorker = null;
            setTimeout(() => enableManualMode("Автофокус недоступний. Зроби фото вручну"), 200);
        }

        // ============ Цикл аналізу ============
        function startAnalyzer() {
            if (!analyzerWorker) return;
            clearInterval(processInterval);
            focusFrames = 0;
            isProcessingFrame = false;
            focusProgress.style.width = '0%';

            processInterval = setInterval(() => {
                if (isCaptured || video.readyState !== 4 || isProcessingFrame) return;

                const r = getCropRect();
                if (!r) return;

                // Аналізуємо рівно ту зону, яку потім зріжемо — інакше пороги брешуть
                procCtx.drawImage(video, r.sx, r.sy, r.sw, r.sh, 0, 0, 100, 100);
                const imgData = procCtx.getImageData(0, 0, 100, 100).data;

                isProcessingFrame = true;
                analyzerWorker.postMessage({ imgData: imgData });
            }, 100);
        }

        function startFallbackTimer() {
            clearTimeout(manualFallbackTimer);
            manualFallbackTimer = setTimeout(() => {
                if (!isCaptured) enableManualMode("Не вдається зафіксувати автоматично — зніми вручну");
            }, FALLBACK_MS);
        }

        function resetAnalyzerState() {
            focusFrames = 0;
            badStreak = 0;
            focusProgress.style.width = '0%';
            if (analyzerWorker) analyzerWorker.postMessage({ command: 'reset' });
        }

        // ============ Позиція підказки відносно рамки ============
        // Для високих типів (Свідоцтво) фіксована відстань від низу екрана
        // призводила до накладання тексту на саму рамку/фокус-бар.
        // Рахуємо позицію від фактичного нижнього краю viewfinder.
        function positionHint() {
            if (document.body.classList.contains('state-preview')) {
                hintText.style.top = '';
                hintText.style.bottom = '';
                return;
            }
            const rect = viewfinder.getBoundingClientRect();
            if (!rect.height) return;

            const maxTop = window.innerHeight - 170; // лишаємо місце під кнопку спуску
            // bottom має бути 'auto', а не '' — inline '' лише знімає override,
            // і далі діє stylesheet-правило .hint-text{bottom:...}; разом із
            // заданим top це розтягує блок на всю відстань між ними.
            hintText.style.bottom = 'auto';
            hintText.style.top = Math.min(Math.round(rect.bottom + 22), maxTop) + 'px';
        }

        viewfinder.addEventListener('transitionend', positionHint);
        window.addEventListener('resize', positionHint);

        // ============ Перемикач типу документа ============
        segmentBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (isCaptured) return;
                segmentBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const type = btn.getAttribute('data-type');
                viewfinder.className = `viewfinder ${type}`;
                setHint(HINTS[type]);
                positionHint();
                if (typeHint) typeHint.style.display = 'none';

                resetAnalyzerState();
                startFallbackTimer();
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            });
        });

        // ============ Захоплення кадру ============
        function captureFrame() {
            if (isCaptured) return;
            isCaptured = true;
            clearInterval(processInterval);
            clearTimeout(manualFallbackTimer);

            const r = getCropRect() || {
                sx: 0, sy: 0,
                sw: video.videoWidth || 1280,
                sh: video.videoHeight || 720
            };

            // Обмежуємо довшу сторону — менший payload при тій же читабельності тексту
            const MAX_SIDE = 1600;
            const k = Math.min(1, MAX_SIDE / Math.max(r.sw, r.sh));
            snapCanvas.width  = Math.max(1, Math.round(r.sw * k));
            snapCanvas.height = Math.max(1, Math.round(r.sh * k));

            const ctx = snapCanvas.getContext('2d');
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(video, r.sx, r.sy, r.sw, r.sh, 0, 0, snapCanvas.width, snapCanvas.height);

            // CSS max-width/max-height на <canvas> ненадійно комбінуються зі
            // збереженням пропорцій у WKWebView — картка прев'ю виходила на
            // весь екран. Рахуємо CSS-розмір явно, як для <img>/<video>.
            const maxW = window.innerWidth  * 0.88;
            const maxH = window.innerHeight * 0.58;
            const fit  = Math.min(maxW / snapCanvas.width, maxH / snapCanvas.height, 1);
            snapCanvas.style.width  = Math.round(snapCanvas.width  * fit) + 'px';
            snapCanvas.style.height = Math.round(snapCanvas.height * fit) + 'px';

            video.pause();

            isEncoding = true;
            binaryBlob = null;
            // 0.6 з'їдало дрібний текст документа — для Vision тримаємо 0.85
            snapCanvas.toBlob((blob) => {
                binaryBlob = blob;
                isEncoding = false;
            }, 'image/jpeg', 0.85);

            flashEl.classList.remove('fire');
            void flashEl.offsetWidth;
            flashEl.classList.add('fire');
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            document.body.classList.remove('state-manual');
            document.body.classList.add('state-preview');
            setHint("перевір, чи чітко читається текст");
            positionHint();

            tg.MainButton.setText("✅ ПЕРЕВІРИТИ ДОКУМЕНТ");
            tg.MainButton.setParams({ color: '#97BBA7', text_color: '#1A393F' });
            tg.MainButton.enable();
            tg.MainButton.show();
            tg.BackButton.show();
        }

        // ============ Скидання ============
        function resetScanner() {
            isCaptured = false;
            binaryBlob = null;
            isEncoding = false;

            resetAnalyzerState();

            document.body.classList.remove('state-preview', 'state-manual');
            viewfinder.className = `viewfinder ${activeType()}`;
            setHint(HINTS[activeType()]);
            positionHint();

            tg.MainButton.hideProgress();
            tg.MainButton.hide();
            tg.BackButton.hide();

            video.play().catch(() => {});
            startAnalyzer();
            startFallbackTimer();
        }

        manualBtn.addEventListener('click', captureFrame);
        retakeBtn.addEventListener('click', resetScanner);
        tg.BackButton.onClick(() => { if (isCaptured) resetScanner(); });

        // ============ Відправка ============
        function waitForBlob(timeoutMs = 4000) {
            return new Promise((resolve, reject) => {
                const started = Date.now();
                (function poll() {
                    if (binaryBlob) return resolve(binaryBlob);
                    if (!isEncoding && !binaryBlob) return reject(new Error('encode-failed'));
                    if (Date.now() - started > timeoutMs) return reject(new Error('encode-timeout'));
                    setTimeout(poll, 60);
                })();
            });
        }

        tg.MainButton.onClick(async () => {
            if (!isCaptured) return;

            tg.MainButton.showProgress();
            tg.MainButton.disable();

            let payload;
            try {
                payload = await waitForBlob();
            } catch (e) {
                tg.MainButton.hideProgress();
                tg.MainButton.enable();
                tg.showAlert("Не вдалося підготувати фото. Перезніми, будь ласка");
                return resetScanner();
            }

            const formData = new FormData();
            formData.append('image', payload, 'doc.jpg');
            formData.append('init_data', tg.initData);
            formData.append('timezone', Intl.DateTimeFormat().resolvedOptions().timeZone);

            try {
                const response = await fetch('/api/vision', { method: 'POST', body: formData });
                const result = await response.json();

                tg.MainButton.hideProgress();

                if (result && result.success) {
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    stopCamera();
                    tg.close();
                    return;
                }

                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert((result && result.error) || "⚠️ Помилка перевірки. Спробуй ще раз");
                resetScanner();
                tg.MainButton.enable();
            } catch (err) {
                tg.MainButton.hideProgress();
                tg.showAlert("Помилка з'єднання з сервером. Перевір інтернет і спробуй ще раз");
                resetScanner();
                tg.MainButton.enable();
            }
        });

        // Прибираємо за собою, щоб камера не лишалась активною
        window.addEventListener('pagehide', stopCamera);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearInterval(processInterval);
            } else if (!isCaptured && mediaStream) {
                video.play().catch(() => {});
                resetAnalyzerState();
                startAnalyzer();
            }
        });

        initCamera();
    })();
    </script>
</body>
</html>
