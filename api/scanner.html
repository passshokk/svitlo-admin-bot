<!-- scanner.html -->
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Svitlo Document Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --accent-color: #2481cc;
            --success-color: #31b545;
            --warning-color: #e5b016;
            --bg-color: #0d0f12;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #scanner-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Сегментований перемикач типу документа */
        .segment-control {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 4px;
            z-index: 30;
            width: 90%;
            max-width: 400px;
        }

        .segment-btn {
            flex: 1;
            background: transparent;
            color: #fff;
            border: none;
            padding: 10px 0;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .segment-btn.active {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* Затемнення фону (без подвійного накладання) */
        .overlay-mask {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        /* 1. Забираємо суцільну обводку з рамки видошукача */
        .viewfinder {
            position: relative;
            border-radius: 16px;
            box-shadow: 0 0 0 9999px rgba(13, 15, 18, 0.85); 
            /* border: 2px solid #2481cc; ВИДАЛЕНО, щоб не було некрасивих ліній */
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Пропорції документів */
        .viewfinder.type-id { width: 85vw; max-width: 420px; aspect-ratio: 1.58 / 1; }
        .viewfinder.type-passport { width: 85vw; max-width: 420px; aspect-ratio: 1.42 / 1; }
        .viewfinder.type-cert { width: 75vw; max-width: 380px; aspect-ratio: 1 / 1.41; }

        /* 2. Додаємо м'яке світіння (drop-shadow) суто для кутиків */
        .corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3.5px solid var(--accent-color);
            border-radius: 3px;
            filter: drop-shadow(0 0 6px rgba(36, 129, 204, 0.8));
            transition: all 0.3s ease;
        }

        /* 3. Змінюємо світіння кутиків при русі */
        .status-moving .corner { 
            border-color: var(--warning-color); 
            filter: drop-shadow(0 0 6px rgba(229, 176, 22, 0.8));
        }

        /* 4. Стилізуємо фінальний кадр, який юзер перевірятиме перед відправкою */
        #snapshot-canvas {
            display: none; /* Схований до моменту фото */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90vw;
            max-height: 80vh;
            border-radius: 12px;
            border: 3px solid var(--success-color); /* Зелена рамка успіху */
            box-shadow: 0 0 25px rgba(49, 181, 69, 0.5); /* Зелене світіння */
            z-index: 40;
        }

        .top-left { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
        .top-right { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 12px 0 0; }
        .bottom-left { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 12px; }
        .bottom-right { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 12px 0; }    

        .hint-text {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 15px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 10px 24px;
            border-radius: 20px;
            white-space: nowrap;
            z-index: 20;
            transition: color 0.3s;
        }

        /* Запасна кнопка (Fallback) */
        #manual-snap-btn, #retake-btn {
            display: none;
            position: absolute;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 14px 28px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            z-index: 20;
            transition: background 0.2s;
        }

        #manual-snap-btn:active, #retake-btn:active { background: rgba(255, 255, 255, 0.25); }

        /* Стани аналізатора */
        .status-moving .corner { border-color: var(--warning-color); }
        .status-moving ~ .hint-text { color: var(--warning-color); }
        
        .status-captured .corner { border-color: var(--success-color); }
        .status-captured .scan-line { display: none; }

        canvas { display: none; }
    </style>
</head>
<body>

    <div id="scanner-container">
        <!-- Сегментований UI -->
        <div class="segment-control">
            <button class="segment-btn active" data-type="type-id">🪪 ID-картка</button>
            <button class="segment-btn" data-type="type-passport">📘 Закордонний</button>
            <button class="segment-btn" data-type="type-cert">📄 Свідоцтво</button>
        </div>

        <video id="camera" autoplay playsinline muted></video>

        <!-- Адаптивна рамка -->
        <div class="overlay-mask">
            <div class="viewfinder type-id" id="viewfinder">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
            </div>
        </div>

        <div class="hint-text" id="hint-text">Наведи на документ</div>
        <button id="manual-snap-btn">Сфотографувати</button>
        <button id="retake-btn">🔄 Перезняти</button>
    </div>

    <!-- Hidden Canvases -->
    <canvas id="processing-canvas" width="100" height="100"></canvas>
    <canvas id="snapshot-canvas"></canvas>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // UI Елементи
        const video = document.getElementById('camera');
        const viewfinder = document.getElementById('viewfinder');
        const hintText = document.getElementById('hint-text');
        const manualSnapBtn = document.getElementById('manual-snap-btn');
        const retakeBtn = document.getElementById('retake-btn');
        const segmentBtns = document.querySelectorAll('.segment-btn');

        // Canvas Елементи
        const procCanvas = document.getElementById('processing-canvas');
        const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });
        const snapCanvas = document.getElementById('snapshot-canvas');

        // Стейт-машина
        let isCaptured = false;
        let binaryBlob = null;
        let processInterval = null;
        let manualFallbackTimer = null;

        // Параметри оптимізованого аналізу
        let prevGray = null;
        let focusFrames = 0;
        const MOTION_THRESH = 12; // Чим вище, тим більше руху дозволено
        const SHARPNESS_THRESH = 20; // Мінімальна кількість тексту/контрасту в кадрі
        const FRAMES_TO_FREEZE = 12; // 12 кадрів (1.2 сек) стабільності для автокліку

        const HINTS = {
            'type-id': "Наведи на ID-картку",
            'type-passport': "Наведи на головну сторінку паспорту",
            'type-cert': "Наведи на свідоцтво про народження цілком"
        };

        // --- Безпечна ініціалізація камери з фолбеками ---
        async function initCamera() {
            const idealConstraints = { video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false };
            const fallbackConstraints = { video: { facingMode: "environment" }, audio: false };

            try {
                video.srcObject = await navigator.mediaDevices.getUserMedia(idealConstraints);
            } catch (err) {
                try {
                    video.srcObject = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
                } catch (fallbackErr) {
                    return tg.showAlert("⚠️ Немає доступу до камери. Надай дозвіл у налаштуваннях Telegram");
                }
            }
            
            video.onloadedmetadata = () => {
                startAnalyzer();
                startFallbackTimer();
            };
        }

        // --- Сегментований перемикач ---
        segmentBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if(isCaptured) return;
                segmentBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const type = btn.getAttribute('data-type');
                viewfinder.className = `viewfinder ${type}`;
                hintText.innerText = HINTS[type];
            });
        });

        // --- Ініціалізація Web Worker з обробкою CSP обмежень iOS ---
        let analyzerWorker = null;
        let isProcessingFrame = false; // Запобіжник переповнення черги (Backpressure)

        try {
            const workerCode = `
            let prevGray = null;
            self.onmessage = function(e) {
                if (e.data.command === 'reset') {
                    prevGray = null;
                    return;
                }
                
                const imgData = e.data.imgData;
                let currentGray = new Uint8Array(10000);
                let motion = 0;
                let edges = 0;

                for (let i = 0; i < 10000; i++) {
                    const offset = i * 4;
                    currentGray[i] = (imgData[offset] * 3 + imgData[offset+1] * 4 + imgData[offset+2]) >>> 3;
                    if (prevGray) motion += Math.abs(currentGray[i] - prevGray[i]);
                    if (i % 100 !== 99) edges += Math.abs(currentGray[i] - currentGray[i+1]);
                }
                
                prevGray = currentGray;
                self.postMessage({ motion: motion / 10000, edges: edges / 10000 });
            };
            `;
            const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
            analyzerWorker = new Worker(URL.createObjectURL(workerBlob));

            analyzerWorker.onmessage = (e) => {
                isProcessingFrame = false; // Знімаємо лок після успішної обробки
                
                const { motion, edges } = e.data;
                if (motion > MOTION_THRESH) {
                    viewfinder.classList.add('status-moving');
                    viewfinder.classList.remove('status-focusing');
                    hintText.innerText = "Тримай телефон нерухомо";
                    focusFrames = 0;
                } else {
                    viewfinder.classList.remove('status-moving');
                    if (edges > SHARPNESS_THRESH) {
                        const activeType = document.querySelector('.segment-btn.active').getAttribute('data-type');
                        hintText.innerText = "Фокусуємось...";
                        focusFrames++;
                        if (focusFrames >= FRAMES_TO_FREEZE) captureFrame();
                    } else {
                        focusFrames = 0;
                    }
                }
            };
        } catch (err) {
            console.error("Web Worker заблоковано CSP або не підтримується:", err);
            // Негайно активуємо ручний режим замість блокування UI на 6 секунд
            setTimeout(() => {
                clearInterval(processInterval);
                clearTimeout(manualFallbackTimer);
                viewfinder.classList.remove('status-moving', 'status-focusing');
                manualSnapBtn.style.display = 'block';
                hintText.innerText = "Автофокус недоступний. Зроби фото вручну";
            }, 200);
        }

        // --- Оптимізований аналізатор (ЄДИНИЙ ЕКЗЕМПЛЯР ФУНКЦІЇ) ---
        function startAnalyzer() {
            if (processInterval) clearInterval(processInterval);
            focusFrames = 0;
            isProcessingFrame = false;
            
            processInterval = setInterval(() => {
                // Блокуємо відправку, якщо Worker ще рахує попередній кадр або відео не готове
                if (isCaptured || video.readyState !== 4 || isProcessingFrame || !analyzerWorker) return;

                const vw = video.videoWidth;
                const vh = video.videoHeight;
                const minDim = Math.min(vw, vh);
                const cropSize = minDim * 0.7; 
                const sx = (vw - cropSize) / 2;
                const sy = (vh - cropSize) / 2;

                procCtx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, 100, 100);
                const imgData = procCtx.getImageData(0, 0, 100, 100).data;
                
                isProcessingFrame = true; // Лочимо потік до відповіді від Worker
                analyzerWorker.postMessage({ imgData: imgData });
            }, 100); // Можна безпечно зменшити до 100мс (10 FPS), оскільки UI більше не блокується
        }

        // --- Запасний таймер (Fallback) ---
        function startFallbackTimer() {
            clearTimeout(manualFallbackTimer);
            manualFallbackTimer = setTimeout(() => {
                if (!isCaptured) {
                    // Жорстко вбиваємо автосканер, щоб він не перебив ручний клік
                    clearInterval(processInterval); 
                    
                    viewfinder.classList.remove('status-moving', 'status-focusing');
                    manualSnapBtn.style.display = 'block';
                    hintText.innerText = "Фокус втрачено. Зроби фото вручну";
                }
            }, 6000); // Таймаут 6 сек, щоб дати час на стабілізацію
        }

        // --- Фіксація кадру (Обхід сірого екрана iOS) ---
        function captureFrame() {
            if (isCaptured) return;
            isCaptured = true;
            clearInterval(processInterval);
            clearTimeout(manualFallbackTimer);
            video.pause();

            const vw = video.videoWidth || 1280;
            const vh = video.videoHeight || 720;
            
            // Обрізаємо відступи зліва/справа
            const cropW = vw * 0.9;
            const cropH = vh * 0.8;
            const cropX = (vw - cropW) / 2;
            const cropY = (vh - cropH) / 2;

            snapCanvas.width = cropW;
            snapCanvas.height = cropH;
            const ctx = snapCanvas.getContext('2d');
            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
            
            snapCanvas.toBlob((blob) => { binaryBlob = blob; }, 'image/jpeg', 0.6);
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            
            video.style.display = 'none';
            document.querySelector('.overlay-mask').style.display = 'none';
            document.querySelector('.segment-control').style.display = 'none';
            snapCanvas.style.display = 'block';

            hintText.innerText = "Пересвідчись в якості фото";
            manualSnapBtn.style.display = 'none';
            retakeBtn.style.display = 'block';

            tg.MainButton.setText("✅ ПЕРЕВІРИТИ ДОКУМЕНТ");
            tg.MainButton.show();
        }

        // --- Скидання UI до початкового стану ---
        function resetScanner() {
            isCaptured = false;
            binaryBlob = null;
            focusFrames = 0; // Скидаємо локальний лічильник
    
            // Скидаємо масив попереднього кадру у воркері
            analyzerWorker.postMessage({ command: 'reset' });
            
            // Повертаємо камеру та скануючий інтерфейс
            snapCanvas.style.display = 'none';
            video.style.display = 'block';
            document.querySelector('.overlay-mask').style.display = 'flex';
            document.querySelector('.segment-control').style.display = 'flex';
            
            video.play();
            
            const activeType = document.querySelector('.segment-btn.active').getAttribute('data-type');
            viewfinder.className = `viewfinder ${activeType}`;
            hintText.innerText = HINTS[activeType];
            
            retakeBtn.style.display = 'none';
            tg.MainButton.hide();

            startAnalyzer();
            startFallbackTimer();
        }

        manualSnapBtn.addEventListener('click', captureFrame);
        retakeBtn.addEventListener('click', resetScanner);

        // --- Відправка на бекенд ---
        tg.MainButton.onClick(async () => {
            tg.MainButton.showProgress();
            tg.MainButton.disable();

            const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const formData = new FormData();
            formData.append('image', binaryBlob, 'doc.jpg');
            formData.append('init_data', tg.initData);
            formData.append('timezone', userTimezone);

            try {
                const response = await fetch('/api/vision', {
                    method: 'POST',
                    body: formData // Зверни увагу: Content-Type видалено, браузер встановить його сам (з boundary)
                });

                const result = await response.json();
                tg.MainButton.hideProgress();

                if (result.success) {
                    // Зупиняємо стрім перед закриттям
                    if (video.srcObject) {
                        video.srcObject.getTracks().forEach(track => track.stop());
                    }
                    tg.close();
                } else {
                    tg.showAlert(result.error || "⚠️ Помилка перевірки. Спробуй ще раз");
                    resetScanner();
                    tg.MainButton.enable();
                }
            } catch (err) {
                tg.MainButton.hideProgress();
                tg.showAlert("Помилка з'єднання з сервером");
                resetScanner();
                tg.MainButton.enable();
            }
        });

        initCamera();
    </script>
</body>
</html>
