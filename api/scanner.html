<!-- scanner.html -->
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Svitlo Document Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Брендбук Svitlo School */
            --brand-dark:   #1A393F;
            --brand-gold:   #DCAF42;
            --brand-sage:   #97BBA7;
            --brand-red:    #912627;

            --success-color: var(--brand-sage);
            --bg-color: #000000;

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #scanner-container {
            position: fixed;
            inset: 0;
            background: #000;
            overflow: hidden;
        }

        /* ---------- Верхня панель (вибір типу документа) ---------- */
        .top-bar {
            position: absolute;
            top: calc(var(--safe-top) + 12px);
            left: 0;
            right: 0;
            padding: 0 12px;
            z-index: 60;
        }

        .segment-control {
            display: flex;
            background: rgba(28, 28, 30, 0.55);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 13px;
            padding: 3px;
        }

        .segment-btn {
            flex: 1;
            background: transparent;
            color: rgba(255, 255, 255, 0.65);
            border: none;
            padding: 9px 2px;
            font-size: 12.5px;
            font-weight: 600;
            font-family: inherit;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .25s ease, color .25s ease;
        }

        .segment-btn.active {
            background: rgba(220, 175, 66, 0.28);
            color: #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        }

        /* ---------- Стан "нічого ще не знято" ---------- */
        #idle-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 0 32px;
            text-align: center;
        }

        #idle-screen .icon {
            font-size: 52px;
            opacity: .9;
        }

        #idle-hint {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.4;
            color: rgba(255, 255, 255, 0.85);
            max-width: 320px;
        }

        #capture-btn {
            margin-top: 8px;
            background: var(--brand-gold);
            color: var(--brand-dark);
            border: none;
            padding: 15px 30px;
            border-radius: 22px;
            font-size: 15.5px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: transform .18s ease, opacity .18s ease;
        }

        #capture-btn:active { transform: scale(.97); opacity: .85; }

        /* ---------- Стан прев'ю знімка ---------- */
        #preview-screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #preview-img {
            max-width: 88vw;
            max-height: 58vh;
            border-radius: 14px;
            box-shadow: 0 14px 44px rgba(0, 0, 0, 0.7),
                        0 0 0 1px rgba(255, 255, 255, 0.14);
        }

        .hint-text {
            position: absolute;
            left: 50%;
            bottom: calc(var(--safe-bottom) + 96px);
            transform: translateX(-50%);
            max-width: 88vw;
            text-align: center;
            font-size: 14.5px;
            font-weight: 500;
            line-height: 1.3;
            color: #fff;
            background: rgba(0, 0, 0, 0.55);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 18px;
            z-index: 50;
        }

        .hint-text::before {
            content: "";
            display: inline-block;
            width: 7px;
            height: 7px;
            margin-right: 8px;
            border-radius: 50%;
            background: var(--success-color);
            vertical-align: middle;
        }

        #retake-btn {
            position: absolute;
            left: 50%;
            bottom: calc(var(--safe-bottom) + 26px);
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.14);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.22);
            padding: 13px 26px;
            border-radius: 22px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            z-index: 50;
            transition: background .18s ease, transform .18s ease;
        }

        #retake-btn:active { background: rgba(255, 255, 255, 0.26); transform: translateX(-50%) scale(.97); }

        body.state-preview #idle-screen { display: none; }
        body.state-preview #preview-screen { display: flex; }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>

    <div id="scanner-container">
        <div class="top-bar">
            <div class="segment-control">
                <button class="segment-btn active" data-type="type-id">ID-картка</button>
                <button class="segment-btn" data-type="type-passport">Закордонний</button>
                <button class="segment-btn" data-type="type-cert">Свідоцтво</button>
            </div>
        </div>

        <div id="idle-screen">
            <div class="icon">📄</div>
            <div id="idle-hint">Наведи на ID-картку — має бути видно все поле, текст чіткий</div>
            <button id="capture-btn">📸 Сфотографувати документ</button>
        </div>

        <div id="preview-screen">
            <img id="preview-img" alt="Знімок документа">
        </div>

        <div class="hint-text" id="hint-text" style="display:none">Перевір, чи чітко читається текст</div>
        <button id="retake-btn" style="display:none">🔄 Перезняти</button>

        <input type="file" id="file-input" accept="image/*" capture="environment" hidden>
    </div>

    <script>
    (function () {
        "use strict";

        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        try {
            tg.setHeaderColor('#000000');
            tg.setBackgroundColor('#000000');
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        } catch (e) { /* старі клієнти Telegram */ }

        // --- DOM ---
        const idleHint    = document.getElementById('idle-hint');
        const captureBtn  = document.getElementById('capture-btn');
        const fileInput   = document.getElementById('file-input');
        const previewImg  = document.getElementById('preview-img');
        const hintText    = document.getElementById('hint-text');
        const retakeBtn   = document.getElementById('retake-btn');
        const segmentBtns = document.querySelectorAll('.segment-btn');

        // --- Стейт ---
        let binaryBlob   = null;
        let previewUrl   = null;

        const HINTS = {
            'type-id':       "Наведи на ID-картку — має бути видно все поле, текст чіткий",
            'type-passport': "Наведи на головну сторінку паспорта",
            'type-cert':     "Свідоцтво про народження має вміститись цілком"
        };

        function activeType() {
            const btn = document.querySelector('.segment-btn.active');
            return btn ? btn.getAttribute('data-type') : 'type-id';
        }

        segmentBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                segmentBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                idleHint.innerText = HINTS[btn.getAttribute('data-type')];
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            });
        });

        // ============ Відкриваємо нативну камеру телефону ============
        // Замість власного getUserMedia-переглядача (де впиралися в непередбачувані
        // пропорції/зум камери на iOS) — просто просимо системну Camera-камеру
        // через <input type=file capture>. Вона вже й так знімає правильно.
        captureBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            fileInput.value = ''; // дозволяє обрати той самий файл повторно
            if (!file) return;
            processFile(file);
        });

        // ============ Стиснення фото перед відправкою ============
        // Фото з нативної камери може бути 4-10+ МБ — стискаємо як і раніше:
        // довша сторона ≤1600px, JPEG q=0.85. Бекенд все одно ріже >6МБ.
        function processFile(file) {
            const img = new Image();
            const objUrl = URL.createObjectURL(file);

            img.onload = () => {
                const MAX_SIDE = 1600;
                const scale = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
                const w = Math.max(1, Math.round(img.naturalWidth * scale));
                const h = Math.max(1, Math.round(img.naturalHeight * scale));

                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, w, h);
                URL.revokeObjectURL(objUrl);

                canvas.toBlob((blob) => {
                    if (!blob) {
                        tg.showAlert("Не вдалося обробити фото. Спробуй ще раз");
                        return;
                    }
                    binaryBlob = blob;
                    if (previewUrl) URL.revokeObjectURL(previewUrl);
                    previewUrl = URL.createObjectURL(blob);
                    previewImg.src = previewUrl;
                    showPreview();
                }, 'image/jpeg', 0.85);
            };

            img.onerror = () => {
                URL.revokeObjectURL(objUrl);
                tg.showAlert("Не вдалося прочитати фото. Спробуй ще раз");
            };

            img.src = objUrl;
        }

        function showPreview() {
            document.body.classList.add('state-preview');
            hintText.style.display = 'block';
            retakeBtn.style.display = 'block';
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            tg.MainButton.setText("✅ ПЕРЕВІРИТИ ДОКУМЕНТ");
            tg.MainButton.setParams({ color: '#97BBA7', text_color: '#1A393F' });
            tg.MainButton.enable();
            tg.MainButton.show();
            tg.BackButton.show();
        }

        function resetScanner() {
            binaryBlob = null;
            if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
            previewImg.src = '';

            document.body.classList.remove('state-preview');
            hintText.style.display = 'none';
            retakeBtn.style.display = 'none';

            tg.MainButton.hideProgress();
            tg.MainButton.hide();
            tg.BackButton.hide();
        }

        retakeBtn.addEventListener('click', resetScanner);
        tg.BackButton.onClick(() => { if (binaryBlob) resetScanner(); });

        // ============ Відправка ============
        tg.MainButton.onClick(async () => {
            if (!binaryBlob) return;

            tg.MainButton.showProgress();
            tg.MainButton.disable();

            const formData = new FormData();
            formData.append('image', binaryBlob, 'doc.jpg');
            formData.append('init_data', tg.initData);
            formData.append('timezone', Intl.DateTimeFormat().resolvedOptions().timeZone);

            try {
                const response = await fetch('/api/vision', { method: 'POST', body: formData });
                const result = await response.json();

                tg.MainButton.hideProgress();

                if (result && result.success) {
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    tg.close();
                    return;
                }

                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                tg.showAlert((result && result.error) || "⚠️ Помилка перевірки. Спробуй ще раз");
                resetScanner();
                tg.MainButton.enable();
            } catch (err) {
                tg.MainButton.hideProgress();
                tg.showAlert("Помилка з'єднання з сервером. Перевір інтернет і спробуй ще раз");
                resetScanner();
                tg.MainButton.enable();
            }
        });
    })();
    </script>
</body>
</html>
