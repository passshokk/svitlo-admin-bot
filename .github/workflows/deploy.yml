name: Deploy to Cloud Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # Встановлюємо офіційний Google Cloud SDK на віртуальну машину GitHub
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # Запускаємо команду деплою для cloud run
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy svitlo-auth-bot \
          --source . \
          --region europe-west3 \
          --allow-unauthenticated \
          --min-instances=1 \
          --max-instances=5 \
          --memory 512Mi \
        --update-env-vars BOT_TOKEN="${{ secrets.BOT_TOKEN }}",SERVICE_URL="${{ secrets.SERVICE_URL }}",NOTION_TOKEN="${{ secrets.NOTION_TOKEN }}",WEBHOOK_SECRET="${{ secrets.WEBHOOK_SECRET }}",WEBAPP_URL="${{ secrets.WEBAPP_URL }}",SCHOOL_TODAY_API_KEY="${{ secrets.SCHOOL_TODAY_API_KEY }}"
        # --update-env-vars, а не --set-env-vars: останній ПОВНІСТЮ перезаписує
        # список env vars на кожному деплої, тому будь-яка змінна, додана
        # вручну через `gcloud run services update` (напр. ADMIN_PANEL_SECRET),
        # мовчки зникала б наступним же пушем і клала сервіс при старті.

    # Cron-дайджест "N заявок чекає розгляду в Solar Panel" -> /tasks/admin_review_digest.
    # Крок ідемпотентний: create падає з ALREADY_EXISTS на повторних деплоях,
    # тоді update синхронізує розклад/URL. continue-on-error: до першого разу,
    # поки деплойному сервіс-акаунту (GCP_SA_KEY) не видадуть roles/cloudscheduler.admin
    # (і, за потреби, право ввімкнути cloudscheduler.googleapis.com), крок
    # світитиметься попередженням, але не валить деплой Cloud Run.
    - name: Ensure Cloud Scheduler digest job
      continue-on-error: true
      run: |
        gcloud services enable cloudscheduler.googleapis.com --quiet || true
        gcloud scheduler jobs create http admin-review-digest \
          --location=europe-west3 \
          --schedule="0 9 * * *" \
          --time-zone="Europe/Kyiv" \
          --uri="${{ secrets.SERVICE_URL }}/tasks/admin_review_digest" \
          --http-method=POST \
          --attempt-deadline=60s \
        || gcloud scheduler jobs update http admin-review-digest \
          --location=europe-west3 \
          --schedule="0 9 * * *" \
          --time-zone="Europe/Kyiv" \
          --uri="${{ secrets.SERVICE_URL }}/tasks/admin_review_digest" \
          --http-method=POST \
          --attempt-deadline=60s