name: Deploy to Cloud Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # Встановлюємо офіційний Google Cloud SDK на віртуальну машину GitHub
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # Запускаємо команду деплою для cloud run
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy svitlo-auth-bot \
          --source . \
          --region europe-west3 \
          --allow-unauthenticated \
          --min-instances=1 \
          --max-instances=5 \
          --memory 512Mi \
        --set-env-vars BOT_TOKEN="${{ secrets.BOT_TOKEN }}",SERVICE_URL="${{ secrets.SERVICE_URL }}",NOTION_TOKEN="${{ secrets.NOTION_TOKEN }}",WEBHOOK_SECRET="${{ secrets.WEBHOOK_SECRET }}",WEBAPP_URL="${{ secrets.WEBAPP_URL }}",SCHOOL_TODAY_API_BASE_URL="${{ secrets.SCHOOL_TODAY_API_BASE_URL }}",SCHOOL_TODAY_API_KEY="${{ secrets.SCHOOL_TODAY_API_KEY }}",